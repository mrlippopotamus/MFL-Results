<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#112622">
  <meta name="description" content="Formation analysis and match records for Birkenhead 1907 and the MFL clubs.">
  <title>MFL Results</title>
  <script>(() => {
  const preference = "mfl-results-theme";
  const root = document.documentElement;

  try {
    if (localStorage.getItem(preference) === "dark") root.dataset.theme = "dark";
  } catch {
    // The theme can still be changed for this visit.
  }

  document.addEventListener("DOMContentLoaded", () => {
    const button = document.getElementById("theme-toggle");
    button.setAttribute("aria-pressed", String(root.dataset.theme === "dark"));
    button.addEventListener("click", () => {
      const dark = root.dataset.theme !== "dark";
      root.dataset.theme = dark ? "dark" : "light";
      button.setAttribute("aria-pressed", String(dark));

      try {
        localStorage.setItem(preference, root.dataset.theme);
      } catch {
        // The current view already reflects the choice.
      }
    });
  }, { once: true });
})();
</script>

.preview-rows .data-table th, .preview-rows .data-table td { padding-block: .42rem; }
.error { color: var(--error-ink, #8a3035); font-size: .9rem; line-height: 1.5; margin: .5rem 0 0; }
#toast { position: fixed; z-index: 5; bottom: 17px; right: 16px; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 10px; color: #fff; background: var(--toast, #174735); box-shadow: 0 5px 24px var(--shadow, #162d2240); font-size: .94rem; }
@media (max-width: 1080px) {
  .header-inner { flex-wrap: wrap; gap: 0 14px; padding-top: 12px; }
  #nav { order: 3; width: 100%; overflow-x: auto; min-height: 46px; gap: 20px; align-self: auto; }
}
@media (max-width: 1000px) {
  .picker-controls { grid-template-columns: repeat(3,minmax(0,1fr)); }
}
@media (max-width: 760px) {
  .header-inner { padding-inline: 16px; }
  #nav a { font-size: .875rem; }
  main { padding: 17px 16px 32px; }
  .hero { padding: 23px 22px; min-height: 165px; }
  .pitch { opacity: .4; right: -60px; }
  .hero-copy { max-width: 90%; }
  .stats { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; margin: 13px 0; }
  .stat { padding: 11px 12px; }
  .panel-head { padding: 15px; }
  .panel-head .field-row { width: 100%; }
  .matrix-table th:first-child { min-width: 117px; max-width: 117px; padding-left: 9px; }
  .matrix-table th { min-width: 94px; max-width: 112px; }
  .matrix-cell { min-width: 76px; }
  .matrix-scroll { max-height: 465px; }
  .panel-foot { padding-inline: 13px; }
  .rank-grid { grid-template-columns: 1fr; gap: 9px; }
  .picker-controls { padding-inline: 15px; }
  .import-start { grid-template-columns: 1fr; }
  .mapping { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media (max-width: 450px) {
  .compact-hide { display: none; }
  .header-inner { gap: 0 8px; }
  .header-actions { gap: 6px; }
  .brand { gap: 7px; }
  .brand-mark { width: 34px; height: 34px; }
  .theme-toggle, .top-import { padding-inline: 8px; }
}
@media (max-width: 400px) {
  .hero h1 { font-size: 1.95rem; }
  .picker-controls { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .detail-metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .dialog-head, .dialog-body, .dialog-actions { padding-inline: 14px; }
}
</style>
